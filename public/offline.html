<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Офлайн — Бөөндөө Сурцгаая</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #ecfdf5 0%, #fff 40%);
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        background: #fff;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        border: 1px solid #e2e8f0;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { font-size: 0.9375rem; line-height: 1.6; color: #475569; margin: 0 0 1.5rem; }
      .actions { display: flex; flex-direction: column; gap: 0.5rem; }
      a, button {
        display: block;
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .primary { background: #059669; color: #fff; }
      .secondary { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
      .ghost { background: #fff; color: #334155; border: 1px solid #e2e8f0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Интернэт холболтгүй байна</h1>
      <p>
        Холболтоо шалгаад дахин оролдоорой. Өмнө нээсэн зарим хуудас browser cache
        дээр харагдаж магадгүй.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="location.reload()">Try again</button>
        <a href="/" class="secondary">Back to home</a>
        <a href="/courses" class="ghost">Courses</a>
      </div>
    </div>
  </body>
</html>
